dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  mockito: ^5.4.6
  fake_async: ^1.3.2
# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  generate: true # required for generating localization files
  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  assets:
    - assets/fonts/
    - assets/json/
    - assets/images/
    - assets/certs/
    - assets/images/bgs/
    - assets/images/icons/
    - config/dev/
    - config/prod/
    - config/qa/
    - config/visa_dev/
    - lib/l10n/

  fonts:
    - family: VisaDialectUI
      fonts:
        - asset: assets/fonts/VisaDialectUI-Regular.ttf
        - asset: assets/fonts/VisaDialectUI-RegularItalic.ttf
          style: italic
        - asset: assets/fonts/VisaDialectUI-Light.ttf
          weight: 300
        - asset: assets/fonts/VisaDialectUI-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/VisaDialectUI-Medium.ttf
          weight: 500
        - asset: assets/fonts/VisaDialectUI-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/VisaDialectUI-Semibold.ttf
          weight: 600
        - asset: assets/fonts/VisaDialectUI-SemiboldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/VisaDialectUI-Bold.ttf
          weight: 700
        - asset: assets/fonts/VisaDialectUI-BoldItalic.ttf
          weight: 700
          style: italic

